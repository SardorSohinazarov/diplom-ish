name: Deploy diplom.qales.uz

# The site is generated from README.md, the final diploma PDF and diplom/generator/site.mjs,
# so it is rebuilt only when one of them changes.
on:
  push:
    branches:
      - master
    paths:
      - README.md
      - diplom/*.pdf
      - diplom/*.pptx
      - diplom/generator/site.mjs
      - diplom/generator/site-assets/**
      - diplom/generator/rasmlar/**
      - diplom/generator/package*.json
      - deploy/**
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sardorsohinazarov/diplom-ish

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Code submodules are not needed: the site uses only files of this repository.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: diplom/generator/package-lock.json

      # pdftotext extracts the diploma text for llms-full.txt.
      - name: Install poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Build site
        working-directory: diplom/generator
        run: |
          npm ci
          node site.mjs

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Copy compose and proxy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/docker-compose.yml,deploy/diplom.caddy
          target: /opt/diplom
          strip_components: 1

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /opt/diplom

            # The package may be private while the repository is; the job token can read it.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull site
            docker compose up -d site
            docker logout ghcr.io

            # Site file for the shared proxy; reload only when it changed.
            if ! cmp -s diplom.caddy /opt/proxy/sites/diplom.caddy; then
              cp diplom.caddy /opt/proxy/sites/diplom.caddy
              docker exec proxy-caddy caddy reload --config /etc/caddy/Caddyfile
            fi

            for i in $(seq 1 30); do
              if docker exec diplom-site wget -q -O /dev/null http://localhost/; then
                echo "Site is healthy"
                docker image prune -f
                exit 0
              fi
              sleep 2
            done

            echo "Site did not become healthy"
            docker logs diplom-site --tail 50
            exit 1
