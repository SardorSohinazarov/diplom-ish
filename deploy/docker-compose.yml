# VPS'dagi /opt/diplom/docker-compose.yml. Workflow (.github/workflows/deploy-site.yml) uni har safar
# serverga o'zi ko'chiradi, qo'lda o'zgartirish shart emas.
#
# Konteyner hech qanday portni tashqariga chiqarmaydi: umumiy proxy (proxy-caddy) unga "proxy" Docker
# tarmog'i orqali diplom-site:80 manzilida ulanadi (deploy/diplom.caddy).
name: diplom

services:
  site:
    image: ghcr.io/sardorsohinazarov/diplom-ish:${IMAGE_TAG:-latest}
    container_name: diplom-site
    restart: unless-stopped
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
