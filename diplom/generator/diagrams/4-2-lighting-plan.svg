<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Times New Roman, serif" font-size="22" fill="#111">
  <defs>
    <marker id="t" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <line x1="1" y1="9" x2="9" y2="1" stroke="#111" stroke-width="1.6"/>
    </marker>
    <g id="lamp">
      <rect x="-27" y="-27" width="54" height="54" fill="#fff" stroke="#111" stroke-width="2" stroke-dasharray="6 3"/>
      <line x1="-27" y1="-27" x2="27" y2="27" stroke="#111" stroke-width="1.5"/>
      <line x1="27" y1="-27" x2="-27" y2="27" stroke="#111" stroke-width="1.5"/>
    </g>
    <g id="desk">
      <rect x="0" y="0" width="108" height="72" fill="#e3e3e3" stroke="#111" stroke-width="2"/>
      <rect x="29" y="4" width="50" height="7" fill="#444"/>
      <circle cx="54" cy="98" r="16" fill="#fff" stroke="#111" stroke-width="2"/>
    </g>
  </defs>
  <rect width="1000" height="700" fill="#fff"/>

  <!-- desks (floor) -->
  <use href="#desk" x="117" y="212"/>
  <use href="#desk" x="306" y="212"/>
  <use href="#desk" x="495" y="212"/>
  <use href="#desk" x="171" y="405"/>
  <use href="#desk" x="441" y="405"/>

  <!-- luminaires (ceiling), 4 × 3 -->
  <use href="#lamp" x="157.5" y="180"/><use href="#lamp" x="292.5" y="180"/><use href="#lamp" x="427.5" y="180"/><use href="#lamp" x="562.5" y="180"/>
  <use href="#lamp" x="157.5" y="360"/><use href="#lamp" x="292.5" y="360"/><use href="#lamp" x="427.5" y="360"/><use href="#lamp" x="562.5" y="360"/>
  <use href="#lamp" x="157.5" y="540"/><use href="#lamp" x="292.5" y="540"/><use href="#lamp" x="427.5" y="540"/><use href="#lamp" x="562.5" y="540"/>

  <!-- walls -->
  <path d="M90,90 H630 V630 H396 M324,630 H90 Z" fill="none" stroke="#111" stroke-width="10"/>
  <!-- windows in the left wall -->
  <g stroke="#111" stroke-width="1.5">
    <rect x="84" y="180" width="12" height="126" fill="#fff"/><line x1="90" y1="180" x2="90" y2="306"/>
    <rect x="84" y="396" width="12" height="126" fill="#fff"/><line x1="90" y1="396" x2="90" y2="522"/>
  </g>
  <text x="70" y="243" text-anchor="middle" transform="rotate(-90 70 243)">Deraza</text>
  <text x="70" y="459" text-anchor="middle" transform="rotate(-90 70 459)">Deraza</text>
  <!-- door -->
  <line x1="324" y1="630" x2="324" y2="558" stroke="#111" stroke-width="3"/>
  <path d="M324,558 A72,72 0 0 1 396,630" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="360" y="660" text-anchor="middle">Eshik</text>

  <!-- top dimension chain -->
  <g stroke="#111" stroke-width="1.2">
    <line x1="90" y1="58" x2="630" y2="58"/>
    <line x1="90" y1="48" x2="90" y2="85"/><line x1="157.5" y1="48" x2="157.5" y2="68"/><line x1="292.5" y1="48" x2="292.5" y2="68"/>
    <line x1="427.5" y1="48" x2="427.5" y2="68"/><line x1="562.5" y1="48" x2="562.5" y2="68"/><line x1="630" y1="48" x2="630" y2="85"/>
  </g>
  <g font-size="19" text-anchor="middle">
    <text x="124" y="46">750</text><text x="225" y="46">1500</text><text x="360" y="46">1500</text><text x="495" y="46">1500</text><text x="596" y="46">750</text>
  </g>
  <!-- right dimension chain -->
  <g stroke="#111" stroke-width="1.2">
    <line x1="668" y1="90" x2="668" y2="630"/>
    <line x1="640" y1="90" x2="678" y2="90"/><line x1="658" y1="180" x2="678" y2="180"/><line x1="658" y1="360" x2="678" y2="360"/>
    <line x1="658" y1="540" x2="678" y2="540"/><line x1="640" y1="630" x2="678" y2="630"/>
  </g>
  <g font-size="19">
    <text x="680" y="142">1000</text><text x="680" y="277">2000</text><text x="680" y="457">2000</text><text x="680" y="592">1000</text>
  </g>
  <!-- overall -->
  <line x1="90" y1="684" x2="630" y2="684" stroke="#111" stroke-width="1.2"/>
  <line x1="90" y1="674" x2="90" y2="694" stroke="#111" stroke-width="1.2"/>
  <line x1="630" y1="674" x2="630" y2="694" stroke="#111" stroke-width="1.2"/>
  <text x="520" y="678" text-anchor="middle" font-size="19">6000</text>

  <!-- legend -->
  <g transform="translate(760,150)">
    <use href="#lamp" x="27" y="27"/>
    <text x="0" y="90">LED yoritgich</text>
    <text x="0" y="116">600×600 mm,</text>
    <text x="0" y="142">36 W, 3600 lm</text>
    <text x="0" y="168">(12 dona)</text>

    <rect x="0" y="230" width="84" height="56" fill="#e3e3e3" stroke="#111" stroke-width="2"/>
    <rect x="17" y="234" width="50" height="7" fill="#444"/>
    <circle cx="42" cy="310" r="16" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="0" y="360">Ish joyi: stol,</text>
    <text x="0" y="386">monitor va stul</text>
    <text x="0" y="412">(5 ta)</text>
  </g>
</svg>
