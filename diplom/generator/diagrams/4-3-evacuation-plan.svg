<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Times New Roman, serif" font-size="22" fill="#111">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0a8f3c"/>
    </marker>
    <g id="ext"><circle r="10" fill="#d62020" stroke="#7a0000" stroke-width="1.5"/><rect x="-3" y="-15" width="6" height="6" fill="#7a0000"/></g>
    <g id="alarm"><rect x="-8" y="-8" width="16" height="16" fill="#d62020" stroke="#7a0000" stroke-width="1.5"/><circle r="3.5" fill="#fff"/></g>
    <g id="hyd"><rect x="-13" y="-9" width="26" height="18" fill="#d62020" stroke="#7a0000" stroke-width="1.5"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">K</text></g>
    <g id="here"><circle r="11" fill="#f5a300" stroke="#111" stroke-width="1.5"/><circle r="4" fill="#111"/></g>
  </defs>
  <rect width="1200" height="700" fill="#fff"/>

  <!-- rooms -->
  <g fill="#fafafa" stroke="#111" stroke-width="4">
    <rect x="60" y="30" width="100" height="170"/>
    <rect x="160" y="30" width="420" height="230"/>
    <rect x="580" y="30" width="240" height="230"/>
    <rect x="820" y="30" width="220" height="230"/>
    <rect x="1040" y="30" width="100" height="170"/>
    <rect x="60" y="390" width="100" height="140"/>
    <rect x="160" y="320" width="260" height="210"/>
    <rect x="420" y="320" width="340" height="210"/>
    <rect x="760" y="320" width="280" height="210"/>
    <rect x="1040" y="390" width="100" height="140"/>
  </g>
  <!-- stairs -->
  <g fill="#fff" stroke="#111" stroke-width="4">
    <rect x="60" y="200" width="100" height="190"/>
    <rect x="1040" y="200" width="100" height="190"/>
  </g>
  <g stroke="#555" stroke-width="1.5">
    <path d="M70,210 H150 M70,220 H150 M70,230 H150 M70,240 H150 M70,250 H150 M70,260 H150"/>
    <path d="M70,330 H150 M70,340 H150 M70,350 H150 M70,360 H150 M70,370 H150 M70,380 H150"/>
    <path d="M1050,210 H1130 M1050,220 H1130 M1050,230 H1130 M1050,240 H1130 M1050,250 H1130 M1050,260 H1130"/>
    <path d="M1050,330 H1130 M1050,340 H1130 M1050,350 H1130 M1050,360 H1130 M1050,370 H1130 M1050,380 H1130"/>
  </g>
  <!-- outer wall -->
  <rect x="60" y="30" width="1080" height="500" fill="none" stroke="#111" stroke-width="8"/>

  <!-- doors (gaps in walls) -->
  <g fill="#fff">
    <rect x="520" y="255" width="36" height="10"/><rect x="600" y="255" width="36" height="10"/><rect x="850" y="255" width="36" height="10"/>
    <rect x="370" y="315" width="36" height="10"/><rect x="440" y="315" width="36" height="10"/><rect x="790" y="315" width="36" height="10"/>
    <rect x="1035" y="272" width="10" height="36"/><rect x="155" y="272" width="10" height="36"/>
  </g>

  <!-- room labels -->
  <g text-anchor="middle">
    <text x="370" y="85">Dasturchilar bo‘limi</text><text x="370" y="112">(open space, 20 kishi)</text>
    <text x="700" y="85">Testlash bo‘limi</text><text x="700" y="112">(10 kishi)</text>
    <text x="930" y="85">Server xonasi</text>
    <text x="290" y="490">Majlislar xonasi</text><text x="290" y="516">(5 kishi)</text>
    <text x="590" y="490">Loyiha menejerlari</text><text x="590" y="516">(10 kishi)</text>
    <text x="900" y="440">Arxiv</text>
    <text x="300" y="296" font-style="italic">Yo‘lak</text>
    <g font-size="18"><text x="110" y="110">Oshxona</text><text x="1090" y="100">Elektr</text><text x="1090" y="122">xonasi</text>
      <text x="110" y="465">Sanuzel</text><text x="1090" y="465">Lift</text></g>
  </g>
  <text x="38" y="295" text-anchor="middle" transform="rotate(-90 38 295)">2-zina (zaxira)</text>
  <text x="1170" y="295" text-anchor="middle" transform="rotate(90 1170 295)">1-zina (asosiy)</text>

  <!-- evacuation routes -->
  <g fill="none" stroke="#0a8f3c" stroke-width="6" stroke-linejoin="round" marker-end="url(#g)">
    <polyline points="390,282 1092,282"/>
    <polyline points="190,165 538,165 538,270"/>
    <polyline points="760,160 618,160 618,270"/>
    <polyline points="990,160 868,160 868,270"/>
    <polyline points="250,440 388,440 388,296"/>
    <polyline points="640,440 458,440 458,296"/>
  </g>
  <polyline points="370,304 104,304" fill="none" stroke="#0a8f3c" stroke-width="5" stroke-dasharray="14 9" marker-end="url(#g)"/>

  <!-- safety equipment -->
  <use href="#ext" x="205" y="275"/><use href="#ext" x="700" y="309"/><use href="#ext" x="1018" y="309"/><use href="#ext" x="1012" y="60"/><use href="#ext" x="190" y="60"/>
  <use href="#alarm" x="1024" y="268"/><use href="#alarm" x="176" y="268"/>
  <use href="#hyd" x="562" y="308"/>
  <use href="#here" x="880" y="306"/>

  <!-- legend -->
  <g font-size="21">
    <line x1="70" y1="572" x2="140" y2="572" stroke="#0a8f3c" stroke-width="6" marker-end="url(#g)"/>
    <text x="155" y="579">Asosiy evakuatsiya yo‘li</text>
    <line x1="470" y1="572" x2="540" y2="572" stroke="#0a8f3c" stroke-width="5" stroke-dasharray="14 9" marker-end="url(#g)"/>
    <text x="555" y="579">Zaxira evakuatsiya yo‘li</text>
    <use href="#here" x="885" y="572"/><text x="905" y="579">Siz shu yerdasiz</text>

    <use href="#ext" x="100" y="624"/><text x="155" y="631">O‘t o‘chirgich</text>
    <use href="#alarm" x="505" y="624"/><text x="555" y="631">Qo‘lda ishga tushiriladigan xabarlagich</text>
    <use href="#hyd" x="100" y="672"/><text x="155" y="679">Ichki yong‘in krani</text>
    <text x="555" y="679">Qavatdagi xodimlar: 45 kishi. Tashqi chiqish – 1-qavatda</text>
  </g>
</svg>
