<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="Times New Roman, serif" font-size="23" fill="#111">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="1000" height="660" fill="#fff"/>

  <!-- floor -->
  <line x1="40" y1="620" x2="960" y2="620" stroke="#111" stroke-width="3"/>
  <g stroke="#999" stroke-width="1.5">
    <line x1="60" y1="620" x2="45" y2="638"/><line x1="140" y1="620" x2="125" y2="638"/><line x1="220" y1="620" x2="205" y2="638"/>
    <line x1="300" y1="620" x2="285" y2="638"/><line x1="380" y1="620" x2="365" y2="638"/><line x1="460" y1="620" x2="445" y2="638"/>
    <line x1="540" y1="620" x2="525" y2="638"/><line x1="620" y1="620" x2="605" y2="638"/><line x1="700" y1="620" x2="685" y2="638"/>
    <line x1="780" y1="620" x2="765" y2="638"/><line x1="860" y1="620" x2="845" y2="638"/><line x1="940" y1="620" x2="925" y2="638"/>
  </g>

  <!-- desk -->
  <rect x="430" y="330" width="390" height="14" fill="#d9d9d9" stroke="#111" stroke-width="2"/>
  <rect x="798" y="344" width="14" height="276" fill="#d9d9d9" stroke="#111" stroke-width="2"/>

  <!-- keyboard -->
  <rect x="470" y="321" width="62" height="9" fill="#bbb" stroke="#111" stroke-width="1.5"/>

  <!-- monitor -->
  <polygon points="574,150 588,148 604,272 590,274" fill="#555" stroke="#111" stroke-width="2"/>
  <line x1="598" y1="214" x2="610" y2="324" stroke="#111" stroke-width="7"/>
  <rect x="572" y="323" width="76" height="7" fill="#777" stroke="#111" stroke-width="1.5"/>

  <!-- chair -->
  <rect x="250" y="440" width="140" height="16" rx="6" fill="#d9d9d9" stroke="#111" stroke-width="2"/>
  <path d="M252,440 L240,300 L256,298 L268,440 z" fill="#d9d9d9" stroke="#111" stroke-width="2"/>
  <line x1="318" y1="456" x2="318" y2="590" stroke="#111" stroke-width="7"/>
  <line x1="250" y1="594" x2="386" y2="594" stroke="#111" stroke-width="7"/>
  <circle cx="256" cy="607" r="10" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <circle cx="380" cy="607" r="10" fill="#fff" stroke="#111" stroke-width="2.5"/>

  <!-- person -->
  <g stroke="#666" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="292,205 300,425"/>
    <polyline points="300,425 480,425 480,600"/>
    <polyline points="292,212 298,335 470,318"/>
  </g>
  <line x1="470" y1="612" x2="548" y2="612" stroke="#666" stroke-width="14" stroke-linecap="round"/>
  <line x1="293" y1="200" x2="296" y2="178" stroke="#666" stroke-width="12" stroke-linecap="round"/>
  <circle cx="300" cy="148" r="31" fill="#666"/>
  <circle cx="320" cy="145" r="4" fill="#fff"/>

  <!-- lines of sight -->
  <line x1="322" y1="145" x2="585" y2="145" stroke="#111" stroke-width="1.8" stroke-dasharray="8 6"/>
  <line x1="322" y1="145" x2="590" y2="215" stroke="#111" stroke-width="1.8" stroke-dasharray="8 6"/>
  <path d="M430,145 A108,108 0 0 1 426,172" fill="none" stroke="#111" stroke-width="1.8"/>
  <text x="438" y="172">15–20°</text>

  <!-- eye → screen distance -->
  <line x1="322" y1="112" x2="580" y2="112" stroke="#111" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="322" y1="100" x2="322" y2="138" stroke="#111" stroke-width="1"/>
  <line x1="580" y1="100" x2="580" y2="146" stroke="#111" stroke-width="1"/>
  <text x="451" y="100" text-anchor="middle">500–700 mm</text>

  <!-- desk height -->
  <line x1="820" y1="330" x2="900" y2="330" stroke="#111" stroke-width="1"/>
  <line x1="885" y1="330" x2="885" y2="620" stroke="#111" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="895" y="470">680–</text>
  <text x="895" y="496">800 mm</text>

  <!-- seat height -->
  <line x1="190" y1="440" x2="250" y2="440" stroke="#111" stroke-width="1"/>
  <line x1="205" y1="440" x2="205" y2="620" stroke="#111" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="195" y="525" text-anchor="end">400–</text>
  <text x="195" y="551" text-anchor="end">550 mm</text>

  <!-- joint angles -->
  <text x="316" y="368">90–100°</text>
  <text x="330" y="410">90–110°</text>
  <text x="496" y="462">≈ 90°</text>

  <!-- callouts -->
  <line x1="605" y1="150" x2="648" y2="170" stroke="#111" stroke-width="1"/>
  <text x="652" y="170">Ekranning yuqori cheti</text>
  <text x="652" y="196">ko‘z sathida yoki</text>
  <text x="652" y="222">undan biroz pastda</text>

  <line x1="505" y1="330" x2="560" y2="378" stroke="#111" stroke-width="1"/>
  <text x="564" y="384">Klaviatura stol chetidan</text>
  <text x="564" y="410">100–300 mm masofada</text>

  <line x1="530" y1="605" x2="566" y2="560" stroke="#111" stroke-width="1"/>
  <text x="570" y="556">Oyoq kaftlari polda</text>
  <text x="570" y="582">yoki tayanchda</text>

  <line x1="250" y1="370" x2="190" y2="330" stroke="#111" stroke-width="1"/>
  <text x="186" y="304" text-anchor="end">Bel qismini</text>
  <text x="186" y="330" text-anchor="end">tutib turuvchi</text>
  <text x="186" y="356" text-anchor="end">suyanchiq</text>
</svg>
